<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#1e4d2b" />
    <title>My Profile — Potlapalli Farms</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <div class="order-policy-alert">
        <span>
            Sunday deliveries only
            <span class="dot">·</span>
            Order before Saturday 6 PM
            <span class="dot">·</span>
            6 AM – 7 PM IST
        </span>
    </div>

    <header class="header" id="header">
        <div class="container header-inner">
            <div class="logo">
                <a href="index.html" aria-label="Potlapalli Farms — Home">
                    <svg class="logo-symbol" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <circle cx="20" cy="20" r="18.5" stroke="currentColor" stroke-width="1.3"/>
                        <path d="M20 10 Q 12.5 18, 20 30 Q 27.5 18, 20 10 Z" fill="currentColor"/>
                        <path d="M20 13.5 L 20 26.5" stroke="var(--bg-main)" stroke-width="1" stroke-linecap="round"/>
                        <path d="M20 18 Q 17.2 16.6, 15.8 15.2" stroke="var(--bg-main)" stroke-width="0.85" stroke-linecap="round" fill="none"/>
                        <path d="M20 21.5 Q 22.8 20.1, 24.2 18.7" stroke="var(--bg-main)" stroke-width="0.85" stroke-linecap="round" fill="none"/>
                    </svg>
                    <span class="logo-text">
                        <span class="logo-name">Potlapalli</span>
                        <span class="logo-sub">Farms</span>
                    </span>
                </a>
            </div>

            <nav class="desktop-nav" id="desktop-nav">
                <a href="index.html">Home</a>
                <a href="index.html#products">Shop</a>
                <a href="orders.html">My Orders</a>
                <a href="index.html#contact">Contact</a>
            </nav>

            <div class="header-actions">
                <button id="themeToggle" class="icon-btn theme-toggle" aria-label="Toggle dark mode">
                    <i class="fas fa-moon"></i>
                </button>
                <a href="cart.html" class="icon-btn mini-cart" aria-label="Cart">
                    <i class="fas fa-shopping-bag"></i>
                    <span id="cartCount">0</span>
                </a>
                <button class="auth-btn" id="signOutBtn">Log Out</button>
            </div>
        </div>
    </header>

    <main class="profile-page">
        <div class="container">

            <div id="profileContent">
                <div class="profile-loading">
                    <div class="spinner"></div>
                    <p>Loading your profile...</p>
                </div>
            </div>

        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAXmkk4DfFahS9euqh-xR7uS3JpRS0Ll0c",
            authDomain: "potlapallifarm.firebaseapp.com",
            projectId: "potlapallifarm",
            storageBucket: "potlapallifarm.firebasestorage.app",
            messagingSenderId: "1017629729159",
            appId: "1:1017629729159:web:357c420a9de335d427b322",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const THEME_KEY = 'potlapalliTheme';
        const CART_KEY = 'potlapalliCart';
        const profileContent = document.getElementById('profileContent');
        const signOutBtn = document.getElementById('signOutBtn');
        const cartCountEl = document.getElementById('cartCount');

        // --- Theme ---
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = themeToggle?.querySelector('i');
        const applyTheme = (theme) => {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem(THEME_KEY, theme);
            if (themeIcon) themeIcon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        };
        applyTheme(localStorage.getItem(THEME_KEY) || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
        themeToggle?.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            applyTheme(current === 'dark' ? 'light' : 'dark');
        });

        // --- Cart badge ---
        try {
            const cart = JSON.parse(localStorage.getItem(CART_KEY) || '[]');
            if (cartCountEl) cartCountEl.textContent = Array.isArray(cart) ? cart.length : 0;
        } catch {}

        // --- Sign out ---
        signOutBtn?.addEventListener('click', async () => {
            try { await signOut(auth); window.location.replace('index.html'); }
            catch (err) { console.error(err); }
        });

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function renderProfile(profile, user) {
            const initials = (profile.name || user.email || 'P').trim().charAt(0).toUpperCase();
            const memberSince = profile.createdAt?.toDate
                ? profile.createdAt.toDate().toLocaleDateString('en-IN', { month: 'long', year: 'numeric' })
                : 'Member';

            profileContent.innerHTML = `
                <div class="profile-header">
                    <h1>Hello, ${escapeHtml((profile.name || 'there').split(' ')[0])}.</h1>
                    <p>Manage your account details and delivery address below.</p>
                </div>

                <div class="profile-grid">

                    <section class="profile-card">
                        <h2>Delivery details</h2>
                        <p class="card-sub">These are used as the default when you place an order.</p>

                        <form class="profile-form" id="profileForm" novalidate>

                            <div class="field" id="field-name">
                                <label for="name">Full name</label>
                                <input type="text" id="name" name="name" value="${escapeHtml(profile.name || '')}" required />
                                <div class="field-error">Please enter your name.</div>
                            </div>

                            <div class="field" id="field-phone">
                                <label for="phone">Phone number</label>
                                <input type="tel" id="phone" name="phone" maxlength="10" inputmode="numeric" value="${escapeHtml(profile.phone || '')}" required />
                                <div class="field-error">Please enter a valid 10-digit mobile number.</div>
                            </div>

                            <div class="field" id="field-address">
                                <label for="address">Delivery address</label>
                                <textarea id="address" name="address" required>${escapeHtml(profile.address || '')}</textarea>
                                <div class="field-error">Please enter your full address.</div>
                            </div>

                            <button type="submit" class="auth-submit" id="saveBtn">
                                Save changes
                                <i class="fas fa-check"></i>
                            </button>
                        </form>
                    </section>

                    <aside>
                        <section class="profile-card">
                            <h2>Account</h2>
                            <p class="card-sub">Read-only account information.</p>

                            <div class="profile-info-row">
                                <span class="profile-info-label">Email</span>
                                <span class="profile-info-value">${escapeHtml(user.email || '—')}</span>
                            </div>
                            <div class="profile-info-row">
                                <span class="profile-info-label">Member since</span>
                                <span class="profile-info-value">${memberSince}</span>
                            </div>
                            <div class="profile-info-row">
                                <span class="profile-info-label">Initials</span>
                                <span class="profile-info-value">${initials}</span>
                            </div>

                            <button class="profile-signout" id="signOutBtn2">
                                <i class="fas fa-sign-out-alt"></i> Sign out of this account
                            </button>
                        </section>
                    </aside>

                </div>
            `;

            // Bind sign out button 2
            document.getElementById('signOutBtn2')?.addEventListener('click', async () => {
                try { await signOut(auth); window.location.replace('index.html'); }
                catch (err) { console.error(err); }
            });

            // Bind form save
            document.getElementById('profileForm')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const nameEl = document.getElementById('name');
                const phoneEl = document.getElementById('phone');
                const addressEl = document.getElementById('address');
                const saveBtn = document.getElementById('saveBtn');

                const name = nameEl.value.trim();
                const phone = phoneEl.value.trim();
                const address = addressEl.value.trim();

                const nameOk = name.length >= 2;
                const phoneOk = /^[6-9]\d{9}$/.test(phone);
                const addressOk = address.length >= 10;

                document.getElementById('field-name').classList.toggle('has-error', !nameOk);
                document.getElementById('field-phone').classList.toggle('has-error', !phoneOk);
                document.getElementById('field-address').classList.toggle('has-error', !addressOk);

                if (!nameOk || !phoneOk || !addressOk) return;

                saveBtn.disabled = true;
                saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

                try {
                    await updateDoc(doc(db, 'users', user.uid), {
                        name, phone, address,
                        updatedAt: serverTimestamp(),
                    });

                    try { await updateProfile(user, { displayName: name }); } catch {}

                    saveBtn.disabled = false;
                    saveBtn.innerHTML = 'Save changes <i class="fas fa-check"></i>';

                    // Success toast
                    const toast = document.createElement('div');
                    toast.className = 'toast success';
                    toast.innerHTML = '<i class="fas fa-check-circle"></i><span>Profile updated</span>';
                    document.getElementById('toast-container').appendChild(toast);
                    setTimeout(() => toast.classList.add('hiding'), 3000);
                    setTimeout(() => toast.remove(), 3400);

                    // Update greeting
                    const h1 = document.querySelector('.profile-header h1');
                    if (h1) h1.textContent = `Hello, ${name.split(' ')[0]}.`;
                } catch (err) {
                    console.error('Profile update failed:', err);
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = 'Save changes <i class="fas fa-check"></i>';
                    alert('Could not save changes. Please try again.');
                }
            });
        }

        // --- Auth gate: redirect to signin if not signed in ---
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.replace('signin.html?redirect=profile.html');
                return;
            }

            try {
                const snap = await getDoc(doc(db, 'users', user.uid));
                let profile = {};

                if (snap.exists()) {
                    profile = snap.data();
                } else {
                    // Failsafe: create an empty profile doc so rules don't error
                    profile = {
                        uid: user.uid,
                        name: user.displayName || '',
                        email: user.email || '',
                        phone: '',
                        address: '',
                        role: 'customer',
                    };
                    try {
                        await setDoc(doc(db, 'users', user.uid), { ...profile, createdAt: serverTimestamp() });
                    } catch (err) {
                        console.warn('Could not auto-create profile:', err);
                    }
                }

                renderProfile(profile, user);
            } catch (err) {
                console.error('Could not load profile:', err);
                profileContent.innerHTML = `
                    <div class="profile-loading">
                        <p style="color: var(--danger); font-weight: 500;">Could not load your profile. Please try again.</p>
                    </div>`;
            }
        });
    </script>
</body>
</html>
